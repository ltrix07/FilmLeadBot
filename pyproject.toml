[project]
name = "film-traffic-bot"
version = "0.1.0"
description = "Telegram bot infrastructure for FilmTraficBot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4",
    "alembic>=1.16,<2",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.30,<1",
    "cachetools>=5.5,<7",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
